name: Publicar no GitHub Pages

# Publica o app numa URL https, que e o que o iPhone exige para liberar o
# microfone, o armazenamento local e a instalacao na Tela de Inicio. Aberto de
# outra forma — arquivo local, http simples — o Safari bloqueia essas tres
# coisas e o app perde justamente o que ele faz.
on:
  push:
    branches:
      - main
      - claude/bird-song-identifier-app-vntziv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez, sem cancelar a que ja esta rodando: cancelar no meio
# pode deixar o site publicado pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Diz ao job de publicacao se o Pages esta ligado. Sem isso, o repositorio
      # inteiro fica vermelho a cada push so porque uma configuracao do site do
      # GitHub — que nao da para mexer daqui — ainda nao foi marcada.
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos e testes
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm test

      - name: Build do app
        run: npm run build

      - name: Build do arquivo unico
        run: |
          npm run build:single
          cp ornis.html dist/ornis.html

      # O arquivo unico fica baixavel na pagina desta execucao mesmo quando o
      # Pages ainda nao esta ligado, entao sempre ha um caminho para levar o app
      # ao aparelho.
      - name: Publicar ornis.html como anexo da execucao
        uses: actions/upload-artifact@v4
        with:
          name: ornis-html
          path: ornis.html
          if-no-files-found: error

      # `continue-on-error` porque este passo falha por um motivo esperado:
      # Pages ainda nao ativado no repositorio. Nao e defeito do codigo, e nao
      # deve reprovar a verificacao de tipos e os testes que ja passaram acima.
      - name: Configurar Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explicar o que falta quando o Pages esta desligado
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages desligado::O app foi construido e testado com sucesso, mas nao ha para onde publicar."
          echo ""
          echo "Para ligar, uma vez so:"
          echo "  1. Settings -> Pages neste repositorio"
          echo "  2. Em 'Source', escolha 'GitHub Actions'"
          echo "  3. Rode este fluxo de novo"
          echo ""
          echo "Enquanto isso, o arquivo unico ornis.html esta anexado a esta execucao."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
